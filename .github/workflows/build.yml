name: Build SeniorCollab

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Gerar plataformas
        run: |
          flutter create --org com.seniormy --project-name seniorcollab --platforms android,ios .
          python3 scripts/patch_platforms.py
      - run: flutter pub get
      - run: flutter test
      - name: Build APK
        run: flutter build apk --release --target-platform android-arm64
      - name: Renomear
        run: |
          V=$(grep '^version:' pubspec.yaml | sed 's/version: //; s/+.*//')
          echo "VERSION=$V" >> $GITHUB_ENV
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/SeniorCollab-$V-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*.apk

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Gerar plataformas
        run: |
          flutter create --org com.seniormy --project-name seniorcollab --platforms android,ios .
          python3 scripts/patch_platforms.py
      - run: flutter pub get
      - name: Build iOS (sem assinatura)
        run: flutter build ios --release --no-codesign
      - name: Empacotar IPA
        run: |
          V=$(grep '^version:' pubspec.yaml | sed 's/version: //; s/+.*//')
          mkdir -p dist/Payload
          cp -R build/ios/iphoneos/Runner.app dist/Payload/
          cd dist && zip -qr SeniorCollab-$V-ios-unsigned.ipa Payload && rm -rf Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: dist/*.ipa

  release:
    needs: [android, ios]
    if: always() && needs.android.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(grep '^version:' pubspec.yaml | sed 's/version: //; s/+.*//')
          FILES=$(find dist -type f \( -name '*.apk' -o -name '*.ipa' \))
          if gh release view "v$V" >/dev/null 2>&1; then
            gh release upload "v$V" $FILES --clobber
          else
            gh release create "v$V" $FILES --title "SeniorCollab $V" --notes "APK para Android (arm64) e IPA sem assinatura para iPhone."
          fi
