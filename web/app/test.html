<!doctype html><meta charset="utf-8"><title>SeniorCollab teste de render</title>
<body style="font:14px monospace;background:#111;color:#eee;padding:16px">
<h3>Teste automático de renderização</h3><pre id="log">rodando…</pre><video id="v" controls playsinline style="max-width:300px"></video>
<script type="module">
import * as db from './js/db.js';
import { renderProject } from './js/render.js';
import { mediaMeta, decodeAudio } from './js/media.js';
import { audioCtx } from './js/player.js';
const log = (m) => { document.getElementById('log').textContent += '\n' + m; };
try {
  const files = ['test/frag-portrait.mp4', 'test/plain-landscape.mov'];
  const tracks = [];
  for (const f of files) {
    const blob = await (await fetch(f)).blob();
    const id = await db.putMedia(new Blob([blob], { type: f.endsWith('mov') ? 'video/quicktime' : 'video/mp4' }));
    const meta = await mediaMeta(id);
    const v = meta.video;
    const dur = Math.max(...v.samples.map(s => (s.cts - v.t0 + s.duration) * 1000 / s.ts));
    const ab = await decodeAudio(id, audioCtx());
    log(`${f}: ${v.codec} ${v.width}x${v.height} rot ${v.rotation} samples ${v.samples.length} dur ${Math.round(dur)}ms audio ${meta.audio?.codec} decoded ${ab ? ab.duration.toFixed(2) + 's' : 'NÃO'}`);
    tracks.push({ id: db.uid(), name: f, mediaId: id, durationMs: Math.round(dur), hasAudio: true, offsetMs: tracks.length ? -350 : 0, volume: 1, muted: false, showVideo: true, eq: 'voz', comp: true, noise: true, reverb: 0.2 });
  }
  for (const [format, quality] of [['9:16', 'hd'], ['16:9', 'fhd']]) {
    const p = { id: 'x', name: 'teste', format, layout: 'auto', separar: true, quality, tracks };
    const t0 = performance.now();
    const r = await renderProject(p, { quality, onStatus: () => {} });
    log(`RENDER ${format} ${quality}: OK ${r.width}x${r.height} ${(r.blob.size / 1e6).toFixed(2)}MB ${r.codec} audio ${r.audio} em ${((performance.now() - t0) / 1000).toFixed(1)}s`);
    const v = document.getElementById('v'); v.src = URL.createObjectURL(r.blob);
    await new Promise(res => { v.onloadedmetadata = res; v.onerror = res; setTimeout(res, 3000); });
    log(`  duração do arquivo: ${v.duration?.toFixed(2)}s, tamanho ${v.videoWidth}x${v.videoHeight}`);
  }
  log('TUDO OK');
} catch (e) { log('ERRO: ' + (e.message || e) + '\n' + (e.stack || '')); }
</script>
